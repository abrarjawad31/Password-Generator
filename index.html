<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
</head>
<body>
    <h1 id = "heading">Password Generator</h1>
    <p id = "description">Generate a secure password with customizable options.</p>

    <input type="text" id="password" placeholder="password" readonly>
    <button id = "copy">Copy</button>
    <div>
        <label for = "length">Password Length:</label>
        <span id="lengthValue">12</span>
        <input type="range" id="length" min="8" max="128" value="12">
    </div>

    <div>
        <input type="checkbox" id="uppercase" checked>
        <label for="uppercase">Include Uppercase Letters</label>
    </div>
    <div>
        <input type="checkbox" id="lowercase" checked>
        <label for="lowercase">Include Lowercase Letters</label>
    </div>
    <div>
        <input type="checkbox" id="numbers" checked>
        <label for="numbers">Include Numbers</label>
    </div>
    <div>
        <input type="checkbox" id="symbols" checked>
        <label for="symbols">Include Symbols</label>
    </div>

    <button id = "generate">Generate Password</button>

    <script src = "script.js"></script>

</body>
</html>
